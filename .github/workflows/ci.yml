name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements-browser.txt
      - run: python3 -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix tools/documentation --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/check_docs.py --mermaid
      - name: Exercise the local studio API and browser
        shell: bash
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run --project src/VisualAgentWorkflow.Studio --configuration Release --no-build > /tmp/studio-smoke.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid" 2>/dev/null || true' EXIT
          python3 scripts/studio_smoke.py --browser
          python3 scripts/ui_skill_review.py
          python3 scripts/graph_canvas_smoke.py
          python3 scripts/pipeline_reuse_smoke.py
          python3 scripts/pause_resume_smoke.py
