name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    name: .NET (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
  local-model-inference:
    name: Local model inference (Linux)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - name: Prepare local GGUF cache
        run: mkdir -p "${{ runner.temp }}/qwen3-gguf"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qwen3-gguf
          key: qwen3-1.7b-q4_k_m-daeb8e2d528a7609
      - name: Download the pinned Qwen3 1.7B GGUF
        shell: bash
        run: |
          model="${{ runner.temp }}/qwen3-gguf/Qwen3-1.7B-Q4_K_M.gguf"
          if [[ ! -s "$model" ]]; then
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$model" \
              'https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/daeb8e2d528a760970442092f6bf1e55c3b659eb/Qwen3-1.7B-Q4_K_M.gguf'
          fi
          test "$(stat --format=%s "$model")" = 1282439264
          echo "d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5  $model" | sha256sum --check --status
      - name: Start the prebuilt llama.cpp server
        shell: bash
        run: |
          docker run --detach --name vaw-llama-server \
            --publish 127.0.0.1:11434:8080 \
            --volume "${{ runner.temp }}/qwen3-gguf:/models:ro" \
            ghcr.io/ggml-org/llama.cpp@sha256:20c4196fc08b459a34ef78aaa05b101333b2fac687e30ec99f37b3c9dc071b44 \
            -m /models/Qwen3-1.7B-Q4_K_M.gguf --host 0.0.0.0 --port 8080 \
            --alias qwen3-1.7b --ctx-size 2048 --threads 4 --threads-batch 4 --parallel 1 --n-predict 64 --jinja
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:11434/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/health >/dev/null
      - name: Exercise actual model inference through Agent Framework
        env:
          VAW_RUN_REAL_MODEL_TESTS: "1"
          VAW_REAL_MODEL_ENDPOINT: http://127.0.0.1:11434/v1/
          VAW_REAL_MODEL_NAME: qwen3-1.7b
        run: dotnet test tests/VisualAgentWorkflow.Mcp.Tests --no-build --no-restore --configuration Release --filter "Category=RealModel" --logger "console;verbosity=normal"
  integration:
    name: Linux integration and browser checks
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise standalone service without Studio
        run: python3 scripts/service_smoke.py
      - name: Exercise deterministic checkpoint recovery across processes
        run: python3 scripts/checkpoint_smoke.py
      - run: python3 -m pip install -r scripts/requirements-browser.txt
      - run: python3 -m playwright install --with-deps chromium
      - name: Exercise configured provider with a local protocol fixture
        run: python3 scripts/provider_smoke.py
      - name: Exercise SQLite consumer observation and Studio attachment
        env:
          WorkflowService__RunStore: sqlite
        run: python3 scripts/observation_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix tools/documentation --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/check_docs.py --mermaid
      - name: Exercise the SQLite-backed studio API and browser
        shell: bash
        run: |
          ASPNETCORE_ENVIRONMENT=Development WorkflowStudio__RunStore=sqlite dotnet run --project src/VisualAgentWorkflow.Studio --configuration Release --no-build > /tmp/studio-smoke.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid" 2>/dev/null || true' EXIT
          python3 scripts/studio_smoke.py --browser
          python3 scripts/workbench_smoke.py
          python3 scripts/ui_skill_review.py
          python3 scripts/graph_canvas_smoke.py
          python3 scripts/pipeline_reuse_smoke.py
          python3 scripts/pause_resume_smoke.py
          python3 scripts/conditional_graph_smoke.py
          python3 scripts/parallel_graph_smoke.py
          python3 scripts/loop_graph_smoke.py
          python3 scripts/approval_smoke.py
