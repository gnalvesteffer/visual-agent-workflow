name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    name: .NET (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
  integration:
    name: Linux integration and browser checks
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise standalone service without Studio
        run: python3 scripts/service_smoke.py
      - name: Exercise deterministic checkpoint recovery across processes
        run: python3 scripts/checkpoint_smoke.py
      - run: python3 -m pip install -r scripts/requirements-browser.txt
      - run: python3 -m playwright install --with-deps chromium
      - name: Exercise configured provider with a local protocol fixture
        run: python3 scripts/provider_smoke.py
      - name: Exercise SQLite consumer observation and Studio attachment
        env:
          WorkflowService__RunStore: sqlite
        run: python3 scripts/observation_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix tools/documentation --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/check_docs.py --mermaid
      - name: Exercise the SQLite-backed studio API and browser
        shell: bash
        run: |
          ASPNETCORE_ENVIRONMENT=Development WorkflowStudio__RunStore=sqlite dotnet run --project src/VisualAgentWorkflow.Studio --configuration Release --no-build > /tmp/studio-smoke.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid" 2>/dev/null || true' EXIT
          python3 scripts/studio_smoke.py --browser
          python3 scripts/ui_skill_review.py
          python3 scripts/graph_canvas_smoke.py
          python3 scripts/pipeline_reuse_smoke.py
          python3 scripts/pause_resume_smoke.py
          python3 scripts/conditional_graph_smoke.py
          python3 scripts/approval_smoke.py
